# ZZZ look: thick sticker outlines, black chassis, hard shadow
# source = ~/.config/hypr/zzz-colors.conf
source = ./zzz-colors.conf

general {
    border_size = 3
    col.active_border = $acid
    col.inactive_border = $inactive
    gaps_in = 8
    gaps_out = 14
}

decoration {
    rounding = 14

    # hard offset shadow, no blur = sticker look (Hyprland >= 0.45 syntax)
    shadow {
        enabled = true
        range = 6
        render_power = 4
        offset = 4 4
        color = rgba(000000cc)
    }

    blur {
        enabled = false
    }
}
