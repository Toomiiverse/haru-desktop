# NOW LOADING lock screen — solid acid, black italic text
# needs: Anton font installed
background {
    color = rgba(d3fd00ff)
}

label {
    text = NOW LOADING
    color = rgba(111111ff)
    font_size = 48
    font_family = Anton
    position = 0, 60
    halign = center
    valign = center
}

label {
    text = B A N G B O O   N . E . T .
    color = rgba(111111ff)
    font_size = 14
    font_family = Anton
    position = 0, 10
    halign = center
    valign = center
}

input-field {
    size = 320, 56
    outline_thickness = 3
    inner_color = rgba(111111ff)
    outer_color = rgba(111111ff)
    font_color = rgba(d3fd00ff)
    placeholder_text = enter password
    rounding = 16
    position = 0, -80
    halign = center
    valign = center
}
